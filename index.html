<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شركة سراج | الموقع تحت الإنشاء</title>
    
    <!-- خط Cairo وروموز Font Awesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #0f172a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* الهيدر والشعار */
        header {
            width: 100%;
            max-width: 1100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, #2563eb, #f59e0b);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 20px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        .logo-text {
            font-size: 24px;
            font-weight: 800;
            color: #0f172a;
        }

        .badge {
            background-color: #f1f5f9;
            color: #475569;
            font-size: 13px;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid #e2e8f0;
        }

        /* المحتوى الرئيسي */
        main {
            max-width: 800px;
            text-align: center;
            margin: 40px auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* رسمة الـ 2D المتحركة للمبنى */
        .construction-scene {
            width: 280px;
            height: 220px;
            margin-bottom: 25px;
            position: relative;
        }

        svg {
            width: 100%;
            height: 100%;
        }

        /* تحريك أجزاء المبنى والرافعة */
        .building-block {
            animation: buildUp 3s infinite ease-in-out;
            transform-origin: bottom;
        }

        .block-2 { animation-delay: 0.5s; }
        .block-3 { animation-delay: 1s; }

        @keyframes buildUp {
            0%, 100% { opacity: 0.3; transform: scaleY(0.8); }
            50% { opacity: 1; transform: scaleY(1); }
        }

        .crane-arm {
            animation: rotateCrane 4s infinite ease-in-out;
            transform-origin: 70px 150px;
        }

        @keyframes rotateCrane {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-8deg); }
        }

        .hook-line {
            animation: hookMove 4s infinite ease-in-out;
        }

        @keyframes hookMove {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(10px); }
        }

        /* النصوص والمعلومات */
        h1 {
            font-size: 32px;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 12px;
            line-height: 1.3;
        }

        h1 span {
            color: #2563eb;
        }

        p {
            font-size: 16px;
            color: #64748b;
            line-height: 1.7;
            max-width: 550px;
            margin-bottom: 30px;
        }

        /* نموذج الاشتراك للتنبيهات */
        .subscribe-form {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 450px;
            background-color: #ffffff;
            padding: 6px;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }

        .subscribe-form input {
            flex: 1;
            border: none;
            outline: none;
            padding: 10px 16px;
            font-size: 14px;
            border-radius: 12px;
            color: #0f172a;
        }

        .subscribe-form button {
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            padding: 10px 22px;
            font-size: 14px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .subscribe-form button:hover {
            background-color: #1d4ed8;
        }

        .success-message {
            display: none;
            color: #16a34a;
            font-weight: 700;
            font-size: 14px;
            margin-top: 15px;
        }

        /* الفوتر */
        footer {
            width: 100%;
            max-width: 1100px;
            text-align: center;
            padding: 20px 0;
            border-top: 1px solid #f1f5f9;
            color: #94a3b8;
            font-size: 13px;
        }

        /* تجاوب الشاشات الصغير جداً */
        @media (max-width: 480px) {
            h1 { font-size: 24px; }
            p { font-size: 14px; }
            .subscribe-form { flex-direction: column; border: none; box-shadow: none; padding: 0; }
            .subscribe-form input { border: 1px solid #e2e8f0; padding: 12px; }
            .subscribe-form button { padding: 12px; }
        }
    </style>
</head>
<body>

    <!-- الهيدر -->
    <header>
        <a href="#" class="logo">
            <div class="logo-icon">
                <i class="fa-solid fa-lightbulb"></i>
            </div>
            <span class="logo-text">سِرَاج</span>
        </a>
        <div class="badge">قريباً جداً</div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main>
        <!-- الرسمة المتحركة 2D بالـ SVG -->
        <div class="construction-scene">
            <svg viewBox="0 0 300 220" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- الأرضية -->
                <line x1="20" y1="200" x2="280" y2="200" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
                
                <!-- سكة الرافعة والقاعدة -->
                <rect x="50" y="190" width="40" height="10" rx="2" fill="#64748b"/>
                <line x1="70" y1="190" x2="70" y2="40" stroke="#94a3b8" stroke-width="6"/>
                
                <!-- هيكل الرافعة (شبكة) -->
                <line x1="65" y1="60" x2="75" y2="70" stroke="#cbd5e1" stroke-width="2"/>
                <line x1="65" y1="90" x2="75" y2="100" stroke="#cbd5e1" stroke-width="2"/>
                <line x1="65" y1="120" x2="75" y2="130" stroke="#cbd5e1" stroke-width="2"/>

                <!-- ذراع الرافعة المتحرك -->
                <g class="crane-arm">
                    <line x1="70" y1="45" x2="200" y2="45" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
                    <line x1="70" y1="45" x2="40" y2="45" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
                    <!-- الثقل الخلفي -->
                    <rect x="35" y="40" width="15" height="12" fill="#475569" rx="2"/>
                    
                    <!-- حبل الرافعة والحمل -->
                    <g class="hook-line">
                        <line x1="160" y1="45" x2="160" y2="90" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3"/>
                        <rect x="150" y="90" width="20" height="15" fill="#2563eb" rx="2"/>
                    </g>
                </g>

                <!-- المبنى الذي يتم تشييده -->
                <!-- الطابق الأول (مكتمل) -->
                <rect x="180" y="140" width="70" height="60" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
                <rect x="195" y="155" width="15" height="20" fill="#2563eb" opacity="0.8" rx="2"/>
                <rect x="220" y="155" width="15" height="20" fill="#2563eb" opacity="0.8" rx="2"/>

                <!-- الطابق الثاني (جاري البناء) -->
                <g class="building-block block-1">
                    <rect x="180" y="90" width="70" height="50" fill="#ffffff" stroke="#2563eb" stroke-dasharray="4 4" stroke-width="2"/>
                    <rect x="195" y="105" width="15" height="20" fill="#cbd5e1" rx="2"/>
                </g>

                <!-- الطابق الثالث (عمدان وهيكل) -->
                <g class="building-block block-2">
                    <line x1="185" y1="90" x2="185" y2="60" stroke="#f59e0b" stroke-width="3"/>
                    <line x1="215" y1="90" x2="215" y2="60" stroke="#f59e0b" stroke-width="3"/>
                    <line x1="245" y1="90" x2="245" y2="60" stroke="#f59e0b" stroke-width="3"/>
                </g>
            </svg>
        </div>

        <h1>منصتنا الجديدة <span>تحت الإنشاء</span></h1>
        <p>نعمل حالياً على تطوير موقع شركة سراج لنقدم لكم تجربة استثنائية وباقات استشارية وتسويقية متكاملة. اترك بريدك الإلكتروني لنخبرك فور الانطلاق.</p>

        <!-- نموذج الاشتراك -->
        <form class="subscribe-form" id="notifyForm">
            <input type="email" id="emailInput" placeholder="أدخل بريدك الإلكتروني..." required>
            <button type="submit">أخبرني عند الجاهزية</button>
        </form>
        <div class="success-message" id="successMsg">شبراً لك! تم حفظ بريدك الإلكتروني وسنخبرك فور الإطلاق.</div>
    </main>

    <!-- الفوتر -->
    <footer>
        جميع الحقوق محفوظة &copy; <span id="year"></span> شركة سراج للتسويق والاستشارات.
    </footer>

    <!-- JavaScript -->
    <script>
        // تحديث السنة تلقائياً
        document.getElementById('year').textContent = new Date().getFullYear();

        // التفاعل مع نموذج البريد
        const form = document.getElementById('notifyForm');
        const successMsg = document.getElementById('successMsg');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            // إخفاء النموذج وإظهار رسالة النجاح
            form.style.display = 'none';
            successMsg.style.display = 'block';
        });
    </script>
</body>
</html>
